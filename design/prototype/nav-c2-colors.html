<!doctype html>
<!--
  Jsonita · nav C2 颜色变体（light + dark 双主题）
  C2 形态（实心药丸 + 白字）固定，6 个颜色，右上角切换 light/dark。
  每个颜色两个主题都预设了合理值（dark 略亮但仍保证白字可读）。
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jsonita · nav C2 colors · light/dark</title>
<style>
  :root {
    --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", sans-serif;
    --font-serif: "New York", "Iowan Old Style", Georgia, serif;
    --text: #20232A;
    --text-muted: rgba(26,30,40,0.54);
    --border: rgba(20,26,36,0.075);
    --glass: rgba(255,255,255,0.62);
    --control-bg-hover: rgba(255,255,255,0.40);
    --card-border: rgba(255,255,255,0.5);
    --radius-md: 6px;
  }
  [data-theme="dark"] {
    --text: #F2F4F7;
    --text-muted: rgba(242,244,247,0.72);
    --border: rgba(255,255,255,0.12);
    --glass: rgba(28,32,40,0.9);
    --control-bg-hover: rgba(255,255,255,0.10);
    --card-border: rgba(255,255,255,0.10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 28px 64px;
    font-family: var(--font-ui); color: var(--text);
    -webkit-font-smoothing: antialiased;
    transition: background 300ms;
  }
  body {
    background:
      radial-gradient(900px 640px at 16% 12%, #e6d9c2 0%, transparent 55%),
      radial-gradient(820px 580px at 84% 18%, #c8d8d2 0%, transparent 52%),
      radial-gradient(900px 720px at 72% 88%, #ccc6da 0%, transparent 55%),
      linear-gradient(135deg, #efe6d8, #dde4dc 48%, #d4d6e0 76%, #ccd5d8);
  }
  [data-theme="dark"] body {
    background:
      radial-gradient(900px 640px at 16% 12%, rgba(120,90,50,0.38) 0%, transparent 55%),
      radial-gradient(820px 580px at 84% 18%, rgba(50,90,80,0.32) 0%, transparent 52%),
      radial-gradient(900px 720px at 72% 88%, rgba(70,60,100,0.34) 0%, transparent 55%),
      linear-gradient(135deg, #1f1a14, #1a1e1c 48%, #1b1822 76%, #14181a);
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-family: var(--font-serif); font-size: 30px; font-weight: 400; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lede { color: var(--text-muted); font-size: 14px; margin: 0; }
  .theme-toggle {
    font: 500 13px/1 var(--font-ui); padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--glass); color: var(--text);
    cursor: pointer; backdrop-filter: blur(20px);
  }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }

  .card {
    background: var(--glass); backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid var(--card-border); border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 12px 30px -18px rgba(40,30,20,0.22);
    overflow: hidden;
  }
  [data-theme="dark"] .card { box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 12px 30px -18px rgba(0,0,0,0.5); }
  .card-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 8px; }
  .card-head .vname { font-family: var(--font-serif); font-size: 17px; font-weight: 400; }
  .card-head .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: -1px; background: var(--c); }
  .card-head .hex { font-size: 11px; color: var(--text-muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; margin-left: auto; }
  .nav { padding: 10px; display: flex; flex-direction: column; gap: 1px; }

  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left; border: 0; cursor: pointer;
    font: 450 14px/1 var(--font-ui); color: var(--text-muted);
    padding: 8px 10px; border-radius: var(--radius-md);
    background: transparent; white-space: nowrap;
    transition: background 120ms, color 120ms;
  }
  .nav-btn .icon-wrap { width: 22px; height: 22px; flex: 0 0 auto; display: grid; place-items: center; }
  .nav-btn svg { width: 15px; height: 15px; opacity: 0.5; }
  .nav-btn:hover { background: var(--control-bg-hover); color: var(--text); }
  .nav-btn:hover svg { opacity: 0.85; }
  .nav-btn.on { background: var(--c); color: #fff; font-weight: 600; }
  .nav-btn.on svg { color: #fff; opacity: 1; }

  /* light 值 */
  .s1 { --c: #436F9F; }
  .s2 { --c: #345E87; }
  .s3 { --c: #2A4768; }
  .s4 { --c: #454B55; }
  .s5 { --c: #3A4C8A; }
  .s6 { --c: #2F5D50; }
  /* dark 值（略亮，保证 dark 背景上突出 + 白字可读） */
  [data-theme="dark"] .s1 { --c: #5589B8; }
  [data-theme="dark"] .s2 { --c: #5E92B8; }
  [data-theme="dark"] .s3 { --c: #5A82AC; }
  [data-theme="dark"] .s4 { --c: #6A717D; }
  [data-theme="dark"] .s5 { --c: #6E80C0; }
  [data-theme="dark"] .s6 { --c: #4F9E86; }

  .footnote { margin-top: 24px; font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>C2 颜色 · light / dark</h1>
      <p class="lede">形态固定（实心药丸 + 白字）。右上角切换主题，看每个颜色在 light 和 dark 下的效果。</p>
    </div>
    <button class="theme-toggle" id="theme-toggle">☾ Dark</button>
  </div>
  <div class="grid">
    <div class="card"><div class="card-head"><span class="swatch"></span><span class="vname">蓝灰</span><span class="hex" id="hex-s1">#436F9F</span></div><div class="nav s1" data-nav></div></div>
    <div class="card"><div class="card-head"><span class="swatch"></span><span class="vname">深蓝灰</span><span class="hex" id="hex-s2">#345E87</span></div><div class="nav s2" data-nav></div></div>
    <div class="card"><div class="card-head"><span class="swatch"></span><span class="vname">深石墨蓝</span><span class="hex" id="hex-s3">#2A4768</span></div><div class="nav s3" data-nav></div></div>
    <div class="card"><div class="card-head"><span class="swatch"></span><span class="vname">石墨灰</span><span class="hex" id="hex-s4">#454B55</span></div><div class="nav s4" data-nav></div></div>
    <div class="card"><div class="card-head"><span class="swatch"></span><span class="vname">靛蓝</span><span class="hex" id="hex-s5">#3A4C8A</span></div><div class="nav s5" data-nav></div></div>
    <div class="card"><div class="card-head"><span class="swatch"></span><span class="vname">墨绿（当前）</span><span class="hex" id="hex-s6">#2F5D50</span></div><div class="nav s6" data-nav></div></div>
  </div>
  <p class="footnote">每个颜色 light/dark 各一个值（dark 略亮）。切换主题对比。挑一个，我设成统一强调色（toggle on + nav active 都用），light/dark 两套值都写进 tokens.css。</p>
</div>

<script>
  const HEX = {
    s1: ['#436F9F', '#5589B8'],
    s2: ['#345E87', '#5E92B8'],
    s3: ['#2A4768', '#5A82AC'],
    s4: ['#454B55', '#6A717D'],
    s5: ['#3A4C8A', '#6E80C0'],
    s6: ['#2F5D50', '#4F9E86'],
  };
  const GROUPS = ['General','Shortcuts','AI','History','JSON Transform','About'];
  const ICONS = {
    General: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 14.2a8 8 0 0 0 .1-1.2 8 8 0 0 0-.1-1.2l2-1.5-2-3.5-2.4 1a7.8 7.8 0 0 0-2.1-1.2L14.6 4h-5.2l-.4 2.6a7.8 7.8 0 0 0-2.1 1.2l-2.4-1-2 3.5 2 1.5A8 8 0 0 0 4.4 13a8 8 0 0 0 .1 1.2l-2 1.5 2 3.5 2.4-1a7.8 7.8 0 0 0 2.1 1.2l.4 2.6h5.2l.4-2.6a7.8 7.8 0 0 0 2.1-1.2l2.4 1 2-3.5-2.1-1.5Z"/></svg>',
    Shortcuts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="2.5"/><path d="M7 7V5.5M11 7V5.5M15 7V5.5M19 7V5.5"/></svg>',
    AI: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3.5"/></svg>',
    History: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>',
    'JSON Transform': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8a3 3 0 0 0-3 3v2a3 3 0 0 1-3 3 3 3 0 0 0 3 3"/><path d="M17 8a3 3 0 0 1 3 3v2a3 3 0 0 0 3 3 3 3 0 0 1-3 3"/></svg>',
    About: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>',
  };
  document.querySelectorAll('.nav[data-nav]').forEach((nav) => {
    GROUPS.forEach((g, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'nav-btn' + (i === 0 ? ' on' : '');
      btn.innerHTML = '<span class="icon-wrap">' + (ICONS[g] || '') + '</span><span>' + g + '</span>';
      btn.addEventListener('click', () => {
        nav.querySelectorAll('.nav-btn').forEach((b) => b.classList.remove('on'));
        btn.classList.add('on');
      });
      nav.appendChild(btn);
    });
  });

  const toggle = document.getElementById('theme-toggle');
  const updateHex = () => {
    const dark = document.documentElement.dataset.theme === 'dark';
    Object.entries(HEX).forEach(([k, [l, d]]) => {
      const el = document.getElementById('hex-' + k);
      if (el) el.textContent = dark ? d : l;
    });
    toggle.textContent = dark ? '☀ Light' : '☾ Dark';
  };
  toggle.addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || 'light';
    document.documentElement.dataset.theme = cur === 'light' ? 'dark' : 'light';
    updateHex();
  });
</script>
</body>
</html>
