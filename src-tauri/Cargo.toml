[package]
name = "jsonita"
version = "0.3.0-m0"
description = "Tiny menu-bar JSON toolkit"
edition = "2021"
rust-version = "1.77"
authors = ["Jin Huang"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
