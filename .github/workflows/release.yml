name: release

# Tag-triggered release build: produces unsigned universal DMG (macOS) and
# NSIS .exe (Windows), uploads them to a GitHub Release under both their
# Tauri-generated versioned filename and a stable alias the website links to.
# No code signing / notarization yet — Homebrew Cask v1.1 work (CLAUDE.md).
#
# A separate "tidy" job runs last to delete stale assets from any prior
# partial runs (e.g. wrong-version DMGs from a premature tag push) and to
# merge the two per-platform SHA256 files into one SHA256SUMS.txt so users
# and brew have a single checksum file.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed by softprops/action-gh-release to create the release

jobs:
  macos-dmg:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: pnpm/action-setup@v6.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build unsigned universal DMG
        env:
          TAURI_NO_SIGN: '1'
          TAURI_CI: '1'
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Collect artifacts + stable alias + sha256
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          DMG_PATH="$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)"
          echo "Found DMG: $DMG_PATH"
          cp "$DMG_PATH" "dist/$(basename "$DMG_PATH")"
          cp "$DMG_PATH" dist/Jsonita-macos-universal.dmg
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS-macos.txt)
          cat dist/SHA256SUMS-macos.txt

      - name: Upload macOS artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true

  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: pnpm/action-setup@v6.0.8

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        env:
          TAURI_NO_SIGN: '1'
          TAURI_CI: '1'
        run: pnpm tauri build --bundles nsis

      - name: Collect artifacts + stable alias + sha256
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # native build on windows-latest writes to target/release (no target triple)
          GLOBS=(
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          )
          EXE_PATH=""
          for g in "${GLOBS[@]}"; do
            for f in $g; do
              if [[ -f "$f" ]]; then EXE_PATH="$f"; break 2; fi
            done
          done
          test -n "$EXE_PATH" || { echo "No NSIS exe found"; exit 1; }
          echo "Found EXE: $EXE_PATH"
          cp "$EXE_PATH" "dist/$(basename "$EXE_PATH")"
          cp "$EXE_PATH" dist/Jsonita-windows-x64.exe
          (cd dist && shasum -a 256 *.exe > SHA256SUMS-windows.txt)
          cat dist/SHA256SUMS-windows.txt

      - name: Upload Windows artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS-windows.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true

  tidy:
    # Runs after both build jobs. Deletes stale assets (e.g. a wrong-version
    # DMG left over from a premature tag push) and publishes a single
    # SHA256SUMS.txt combining macOS + Windows checksums.
    needs: [macos-dmg, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Tidy release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tidying release for tag: $TAG"

          # Fetch per-platform sha files from the release and merge into SHA256SUMS.txt
          TMPDIR="$(mktemp -d)"
          cd "$TMPDIR"
          for f in SHA256SUMS-macos.txt SHA256SUMS-windows.txt; do
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$f"
            if curl -fsSL -o "$f" "$url"; then
              echo "got $f"
              cat "$f"
            else
              echo "warning: $f not found (that platform may have failed)"
            fi
          done
          cat SHA256SUMS-macos.txt SHA256SUMS-windows.txt 2>/dev/null > SHA256SUMS.txt || true
          test -s SHA256SUMS.txt && echo "=== merged SHA256SUMS.txt ===" && cat SHA256SUMS.txt

          # Upload merged file (and delete the per-platform shards so they don't clutter)
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          for f in SHA256SUMS-macos.txt SHA256SUMS-windows.txt; do
            gh release delete-asset "$TAG" "$f" -y --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          done

          # Delete any versioned DMG/EXE whose version does NOT match this tag,
          # plus any zero-byte / leftover SHA256SUMS.txt from earlier races.
          VERSION="${TAG#v}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | "\(.id) \(.name) \(.size)"' | while read -r id name size; do
              case "$name" in
                Jsonita-macos-universal.dmg|Jsonita-windows-x64.exe|SHA256SUMS.txt) continue ;;
                Jsonita_*_universal.dmg|Jsonita_*_x64-setup.exe)
                  file_ver="${name#Jsonita_}"; file_ver="${file_ver%%_*}"
                  if [[ "$file_ver" != "$VERSION" ]]; then
                    echo "Deleting stale asset: $name (version $file_ver != $VERSION)"
                    gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$id"
                  fi ;;
                # delete any other stray/old-named files
                *)
                  echo "Deleting stray asset: $name"
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$id" ;;
              esac
            done
