name: release

# Tag-triggered release build. A dedicated "prepare" job creates (or reuses)
# the GitHub Release first; platform jobs then just build + upload assets via
# gh CLI, which avoids the softprops/action-gh-release tag_name race that
# retried forever when two jobs touched the same release concurrently.
# No code signing / notarization yet — Homebrew Cask v1.1 work (CLAUDE.md).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.rel.outputs.upload_url }}
    steps:
      - name: Ensure release exists
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          PRERELEASE=false
          [[ "$TAG" == *-* ]] && PRERELEASE=true
          # gh release create is idempotent-ish: if it exists the command fails,
          # so fall back to view.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --prerelease="$PRERELEASE" \
              --notes "Release $TAG"
          fi
          echo "upload_url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json uploadUrl --jq .uploadUrl)" >> "$GITHUB_OUTPUT"

  macos-dmg:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build unsigned universal DMG
        env:
          TAURI_NO_SIGN: '1'
          TAURI_CI: '1'
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          DMG_PATH="$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)"
          echo "Found DMG: $DMG_PATH"
          cp "$DMG_PATH" "dist/$(basename "$DMG_PATH")"
          cp "$DMG_PATH" dist/Jsonita-macos-universal.dmg

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" dist/*.dmg \
            --repo "$GITHUB_REPOSITORY" --clobber

  windows-exe:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        env:
          TAURI_NO_SIGN: '1'
          TAURI_CI: '1'
        run: pnpm tauri build --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Recurse -Path src-tauri/target -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'bundle[/\\]nsis' } | Select-Object -First 1
          if (-not $exe) { Write-Error "No NSIS exe found"; exit 1 }
          Write-Host "Found EXE: $($exe.FullName)"
          Copy-Item $exe.FullName "dist/$($exe.Name)"
          Copy-Item $exe.FullName "dist/Jsonita-windows-x64.exe"

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" dist/*.exe \
            --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    needs: [macos-dmg, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Download and hash all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          TMP="$(mktemp -d)"
          cd "$TMP"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --pattern '*.exe'
          shasum -a 256 * > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
